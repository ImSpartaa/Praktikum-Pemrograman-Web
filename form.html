<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Form</title>
</head>
<body>
    <h2>form pertama</h2>
    <form>
        <div align="center" style="background-color: red">
            <label>Nama Lengkap :</label>
            <br/>
            <input type="text" />
        </div>
        <br><br>
        <div align="center" style="background-color: blue">
            <label>Nilai : </label>
            <br/>
            <input type="number" />
        </div>
        <br><br>
        <label>Gender :</label>
        <br/>
        <input type="radio" name="gender" value="pria">
        <label>pria</label>
        <br>
        <input type="radio" name="gender" value="wanita">
        <label>wanita</label>
        <br><br>
        <label>Mata Kuliah Fav :</label>
        <br/>
        <input type="checkbox" name="matkulfav" value="jarkom">
        <label for ="jarkom">Jaringan Komputer</label>
        <input type="checkbox" name="matkulfav" value="kalkulus">
        <label for ="kalkulus">kalkulus</label>
        <br><br>

    </form>
</body>
</html>
