<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
      <div class="container-fluid">
        <div class="home">
          <a class="navbar-brand" href="homepage.html">
          <i class="bi bi-book-half"></i> Home
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
          </button>
        </div>  
        <div class="collapse navbar-collapse" id="lihattambahdata">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="lihatdata.html">Lihat Data</a>
          </li>
          <li class="nav-item">
          <a class="nav-link" href="tambahdata.html">Tambah Data</a>
          </li>
          </ul>
        </div>
      </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <div class="container my-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        
        <h2 class="card-title text-center fw-bold mb-4">Formulir Pendataan Mahasiswa</h2>

        <form method="get" action="lihatdata.html">
          
          <div class="mb-3">
            <label for="nama" class="form-label fw-semibold">Nama Mahasiswa</label>
            <input type="text" name="nama" class="form-control" id="nama">
          </div>

          <div class="mb-3">
            <label for="angkatan" class="form-label fw-semibold">Angkatan</label>
            <input type="number" name="angkatan" class="form-control" id="angkatan">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold d-block">Gender</label>
            <div class="form-check form-check">
              <input class="form-check-input" type="radio" name="gender" id="perempuan" value="Perempuan">
              <label class="form-check-label" for="perempuan">Perempuan</label>
            </div>
            <div class="form-check form-check">
              <input class="form-check-input" type="radio" name="gender" id="laki" value="Laki-laki">
              <label class="form-check-label" for="laki">Laki-laki</label>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Kesibukan</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="kesibukan[]" id="magang" value="Magang">
              <label class="form-check-label" for="magang">Magang</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="kesibukan[]" id="asisten" value="Asisten Lab">
              <label class="form-check-label" for="asisten">Asisten Lab</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="kesibukan[]" id="lomba" value="Lomba">
              <label class="form-check-label" for="lomba">Lomba</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="kesibukan[]" id="organisasi" value="Organisasi Kampus">
              <label class="form-check-label" for="organisasi">Organisasi Kampus</label>
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
            <i class="bi bi-plus-lg me-1"></i> Tambah Data
          </button>
          
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
