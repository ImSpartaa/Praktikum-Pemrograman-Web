    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="container mt-4">
    <h1 class="text-center mb-4">Formulir Pendataan Mahasiswa</h1>
</div>

<div class="container mt-4">
<form method="get" action="lihatdata.html" style="background-color: whitesmoke;">
<div class="mb-3">
     <label for="nama" class="form-label">Nama Mahasiswa</label>
     <input type="text" name="nama" class="form-control" id="nama">
</div>
<div class="mb-3">
    <label for="angkatan" class="form-label">Angkatan</label>
    <input type="number" name="angkatan" class="form-control" id="angkatan">
</div>
<div class="mb-3">
    <label class="form-label">Gender</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="perempuan" value="Perempuan">
            <label class="form-check-label" for="perempuan">Perempuan</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="laki" value="Laki-laki">
            <label class="form-check-label" for="laki">Laki-laki</label>
          </div>
</div>
<div class="mb-3">
    <label class="form-label">Kesibukan</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="kesibukan" id="magang" value="Magang">
            <label class="form-check-label" for="magang">Magang</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="kesibukan" id="asisten" value="Asisten Lab">
            <label class="form-check-label" for="asisten">Asisten Lab</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="kesibukan" id="lomba" value="Lomba">
            <label class="form-check-label" for="lomba">Lomba</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="kesibukan" id="organisasi" value="Organisasi Kampus">
            <label class="form-check-label" for="organisasi">Organisasi Kampus</label>
          </div>
</div>
<input type="submit" class="btn btn-dark" value="+ tambah data">
</form>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
