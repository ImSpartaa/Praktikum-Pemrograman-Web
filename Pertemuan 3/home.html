<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Home</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" id="main-navbar">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                </ul>
                <button class="btn btn-outline-secondary me-2" id="alert-example">Click me!</button>
                <a href="login.html"><button class="btn btn-primary" id="logout-button">Logout</button></a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div id="title-card">
            <h1 id="title">Welcome, User!</h1>
        </div>
        <div class="alert alert-primary mt-3" id="window-width-card">
            <p class="m-0">Window width: <span id="window-width">0</span> px</p>
        </div>
        <div>
            <input type="text" class="form-control mt-3" id="keyup-input" placeholder="Type anything">
            <div style="display:flex; justify-content: space-evenly;">
                <p>Released keyboard : <span id="keyup-result"></span></p>
                <p>Status : <span id="keyup-status"></span></p>
            </div>
        </div>
        <div>
            <input type="text" class="form-control mt-3" id="keydown-input" placeholder="Type anything">
            <div style="display:flex; justify-content: space-evenly;">
                <p>Pressed keyboard : <span id="keydown-result"></span></p>
                <p>Status : <span id="keydown-status"></span></p>
            </div>
        </div>
        <p id="page-load" class="alert alert-success mt-3"></p>
        <div class="mt-4 text-center">
            <button class="btn btn-primary me-2" id="btn-add">Add Text</button>
            <button class="btn btn-outline-danger" id="btn-clear">Clear All</button>
            <div id="text-container" class="mt-3"></div>
        </div>
    </div>
    <div id="scroll-badge" class="badge bg-primary p-2 fs-6">
        Scroll: <span id="scroll-percentage">0%</span>
    </div>

    <script src="script.js"></script>
</body>

</html>
