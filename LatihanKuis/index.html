<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
   <link rel="stylesheet" href="style.css">
    <title>Halaman Login</title>
</head>
<body>
    <div class="container">
        <div id="login-card">
            <div id="login-title">
                <h1>Furniture Shop</h1>
                <h4>Login to your account first</h4>
            </div>
            <div id="login-content">
                <img src="login_picture.jpg" width="300px">
                <div id="login-form">
                    <form method="get" action="home.html">
                        <label class="form-label"><i class="bi bi-envelope-at-fill"></i>Email Address</label>
                        <input type="email" class="form-control" name="email" id="email" required>
                        <label class="form-label mt-3"><i class="bi bi-lock-fill"></i>Password</label>
                        <input type="password" class="form-control" name="password" id="password" minlength="8" required>
                        <input type="submit" value="Login" class="btn btn-primary mt-3" id="login-button">
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
